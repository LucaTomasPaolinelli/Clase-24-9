<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia | Formularios</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CLASE - Formularios</h1>
    </header>
    <main>
        <section>
            <article>
                <h3>FORMS</h3>
                <form>
                    <article>
                        <input type="text" placeholder="Ingrese su nombre" required>
                        <input type="number" placeholder="Ingrese su edad" required>
                        <input type="email" placeholder="Ingrese su gmail" autocomplete="off" required>
                    </article>
                    <article>
                        <h3>Comida</h3>
                        <h4>¿Que desea comer?</h4>
                        <img src="iStock-1940092332-Fideos-con-tuco-scaled-1440x1440.jpg" alt="Fideos">
                        <img src="ravioles.jpg" alt="ravioles">
                    </article>
                    <article id="sel">
                        <select name="comida">
                            <option value="1">Fideos</option>
                            <option value="2">Ravioles</option>
                        </select>
                    </article>
                    <article id="rad">
                        <ul>
                            <li>
                                <input type="radio" name="comida" id="INsalsa">
                                <label for="INsalsa">Con salsa</label>
                            </li>
                            <li>
                                <input type="radio"name="comida" id="INcrema">
                                <label for="INcrema">Con crema</label>
                            </li>
                            <li>
                                <input type="radio"name="comida" id="INsolo">
                                <label for="INsolo">Sin nada</label>
                            </li>
                        </ul>
                    </article>
                    <article>
                        <h3>QUEJAS O RECOMENDACIONES</h3>
                        <textarea placeholder="ingrese texto (opcional)" cols="40" rows="10"></textarea>
                    </article>
                    <article id="but">
                        <button onclick="document.getElementById('audio').play()">Enviar</button>
                    </article>
                </form>
            </article>
        </section>
        <audio id="audio" src="formulario completado.m4a"></audio>
    </main>
    <footer>
        <h1>Pagina realizada con HTML, CSS y JVscript</h1>
    </footer>
</body>
</html>
